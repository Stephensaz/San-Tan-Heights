name: M9 Activation CI

on:
  pull_request:
    paths:
      - 'src/activation/**'
      - 'schemas/activation/**'
      - 'registries/activation/**'
      - 'tests/unit/activation/**'
      - 'docs/implementation/M9-*.md'
      - 'BUILD-MANIFEST.yaml'
      - 'VERSION'
      - '.github/workflows/m9-activation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Run M9 activation unit tests
        run: python -m pytest -q tests/unit/activation

      - name: Validate repository structure
        run: python scripts_validate_repo.py
