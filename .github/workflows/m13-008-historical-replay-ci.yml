name: M13-008 Historical Replay Calibration Drift Failure CI
on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-008.md'
      - 'certification-evidence/m13-007h/**'
      - 'certification-evidence/m13-008/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-008-historical-replay-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m13-008:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {clean: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-008 boundary and M13-007H predecessor
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import yaml
          m=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          row=[x for x in m["contracts"] if x["id"]=="STH-HISTORICAL-REPLAY-CALIBRATION-DRIFT-FAILURE"][0]
          p=Path(row["path"]); assert hashlib.sha256(p.read_bytes()).hexdigest()==row["sha256"]
          c=yaml.safe_load(p.read_text()); assert c["status"]=="LOCKED" and c["ticket"]=="M13-008"; assert all(c["hard_boundaries"].values())
          pred=json.loads(Path("certification-evidence/m13-007h/final-certification-v1.0.json").read_text())
          assert pred["ticket"]=="M13-007H" and pred["status"]=="ACCEPTED" and pred["decision"]=="PASS / GO"
          assert pred["waivers"]==0 and pred["open_defects"]==0 and pred["unresolved_blocking_defects"]==0
          b=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text()); assert b["current_ticket"]=="M13-008"
          r=yaml.safe_load(Path("registries/community_temporal_state/m13-008-historical-replay-v1.0.yaml").read_text())
          assert r["status"]=="FROZEN" and r["ticket"]=="M13-008"
          assert all(r["policy"].values())
          print("PASS: M13-008 boundary and certified M13-007H predecessor are pinned")
          PY
      - name: Run M13-008 tests
        run: pytest -q tests/unit/community_temporal_state/test_historical_replay.py
      - name: Replay all M13 temporal-state regressions
        run: pytest -q tests/unit/community_temporal_state
      - name: Replay inherited M12 regressions
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
