name: M13-007A Unified Intelligence Governance CI

on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-007A.md'
      - 'certification-evidence/m13-006j/**'
      - 'certification-evidence/m13-007a/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-007a-unified-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m13-007a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-007A frozen boundary and M13-006 PASS GO predecessor
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import yaml
          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-UNIFIED-SELLER-INTELLIGENCE"]
          assert len(rows)==1
          row=rows[0]; path=Path(row["path"])
          assert hashlib.sha256(path.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(path.read_text())
          assert contract["status"]=="LOCKED" and contract["ticket"]=="M13-007A"
          assert all(contract["hard_boundaries"].values())
          pred=json.loads(Path("certification-evidence/m13-006j/final-certification-v1.0.json").read_text())
          assert pred["ticket"]=="M13-006J"
          assert pred["status"]=="ACCEPTED"
          assert pred["decision"]=="PASS / GO"
          assert pred["waivers"]==0 and pred["open_defects"]==0 and pred["unresolved_blocking_defects"]==0
          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          assert build["current_ticket"]=="M13-007A"
          reg=yaml.safe_load(Path("registries/community_temporal_state/m13-007a-unified-intelligence-v1.0.yaml").read_text())
          assert reg["status"]=="FROZEN" and reg["ticket"]=="M13-007A"
          for key in ("deterministic_output","immutable_state","lineage_required","facts_assumptions_distinct","unknowns_first_class","stale_is_explicit","conflicts_are_explicit","significance_is_descriptive_only","no_recommendation","no_prediction","no_ranking","no_seller_scoring","no_m12_execution","no_publication"):
              assert reg["policy"][key] is True
          print("PASS: M13-007A frozen governance boundary and M13-006 PASS GO predecessor are pinned")
          PY
      - name: Run M13-007A tests
        run: pytest -q tests/unit/community_temporal_state/test_unified_seller_intelligence.py
      - name: Run all M13 temporal-state regression tests
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
