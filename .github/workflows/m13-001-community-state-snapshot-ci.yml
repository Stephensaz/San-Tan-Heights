name: M13-001 Community State Snapshot CI

on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-001.md'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - 'VERSION'
      - '.github/workflows/m13-001-community-state-snapshot-ci.yml'
      - '.github/workflows/m11-architecture-validation.yml'
      - '.github/workflows/m12-architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m13-001:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-001 contract registration and released M12 baseline
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-COMMUNITY-TEMPORAL-STATE"]
          assert len(rows)==1
          row=rows[0]
          p=Path(row["path"])
          assert p.exists()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(p.read_text())
          assert contract["status"]=="LOCKED"
          assert contract["milestone"]=="M13"
          assert contract["ticket"]=="M13-001"

          released=json.loads(Path("certification-evidence/m12-009/final-certification-v1.0.json").read_text())
          assert released["status"]=="ACCEPTED"
          assert released["decision"]=="GO"
          assert released["release_candidate_version"]=="0.1.132"
          assert released["certification_root_hash"]==contract["released_m12"]["certification_root"]

          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M12"]=="ACCEPTED"
          assert states["M13"]=="IN_PROGRESS"
          assert build["current_ticket"]=="M13-001"

          for key in (
              "change_detection_prohibited",
              "impact_propagation_prohibited",
              "upstream_identity_rewrite_prohibited",
              "upstream_phase_rewrite_prohibited",
              "historical_rewrite_prohibited",
              "inferred_dates_prohibited",
              "inferred_values_prohibited",
              "silent_current_data_substitution_prohibited",
              "seller_recommendations_prohibited",
              "listing_actions_prohibited",
              "publication_prohibited",
              "m12_execution_mutation_prohibited",
              "external_publication_prohibited",
              "protected_field_propagation_prohibited",
              "silent_manifest_drift_prohibited",
              "comparison_requires_certified_snapshot",
          ):
              assert contract["hard_boundaries"][key] is True
          print("PASS: M13-001 frozen temporal baseline boundary and M12 release lineage")
          PY
      - name: Run M13-001 unit tests
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
