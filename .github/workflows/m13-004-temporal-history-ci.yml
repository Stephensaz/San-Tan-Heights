name: M13-004 Temporal History CI

on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-004.md'
      - 'certification-evidence/m13-003/**'
      - 'certification-evidence/m13-004/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-004-temporal-history-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m13-004:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-004 frozen boundary and predecessor
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml

          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-COMMUNITY-TEMPORAL-HISTORY"]
          assert len(rows)==1
          row=rows[0]
          path=Path(row["path"])
          assert path.exists()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(path.read_text())
          assert contract["status"]=="LOCKED"
          assert contract["ticket"]=="M13-004"
          assert len(contract["subsequence"])==10
          assert contract["subsequence"][0]=="M13-004A_LEDGER_SCHEMA_AND_TAXONOMY"
          assert contract["subsequence"][-1]=="M13-004J_FINAL_CERTIFICATION_AND_ADJUDICATION"

          pred=json.loads(Path("certification-evidence/m13-003/selective-refresh-acceptance-v1.0.json").read_text())
          assert pred["ticket"]=="M13-003"
          assert pred["status"]=="ACCEPTED"
          assert pred["waivers"]==0
          assert pred["open_defects"]==0

          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          assert build["current_ticket"].startswith("M13-")
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M12"]=="ACCEPTED"
          assert states["M13"]=="IN_PROGRESS"

          for key in (
              "certified_history_rewrite_prohibited",
              "certified_history_delete_prohibited",
              "reality_knowledge_time_conflation_prohibited",
              "inferred_dates_prohibited",
              "fabricated_facts_prohibited",
              "conflict_erasure_prohibited",
              "superseded_evidence_erasure_prohibited",
              "lineage_bypass_prohibited",
              "ui_mutation_prohibited",
              "unaffected_intelligence_regeneration_prohibited",
              "competing_identity_truth_system_prohibited",
              "competing_community_truth_system_prohibited",
              "append_only_corrections_required",
              "seller_recommendations_prohibited",
              "listing_actions_prohibited",
              "publication_prohibited",
              "m12_execution_mutation_prohibited",
          ):
              assert contract["hard_boundaries"][key] is True

          evidence_path=Path("certification-evidence/m13-004/temporal-history-acceptance-v1.0.json")
          if evidence_path.exists():
              evidence=json.loads(evidence_path.read_text())
              assert evidence["ticket"]=="M13-004"
              assert evidence["status"]=="ACCEPTED"
              assert evidence["parent"]["ticket"]=="M13-003"
              assert evidence["community_temporal_history_contract_sha256"]==row["sha256"]
              assert evidence["tests"]["failed"]==0
              assert evidence["waivers"]==0
              assert evidence["open_defects"]==0
              assert all(x["conclusion"]=="success" for x in evidence["github_actions"].values())
          evidence_path=Path("certification-evidence/m13-004/temporal-history-acceptance-v1.0.json")
          if evidence_path.exists():
              evidence=json.loads(evidence_path.read_text())
              assert evidence["ticket"]=="M13-004"
              assert evidence["status"]=="ACCEPTED"
              assert evidence["parent"]["ticket"]=="M13-003"
              assert evidence["community_temporal_history_contract_sha256"]==row["sha256"]
              assert evidence["tests"]["m13_004_specific_tests"]==12
              assert evidence["tests"]["m13_temporal_state_total_passed"]==74
              assert evidence["tests"]["inherited_m12_passed"]==137
              assert evidence["tests"]["failed"]==0
              assert evidence["waivers"]==0
              assert evidence["open_defects"]==0
              assert all(x["conclusion"]=="success" for x in evidence["github_actions"].values())
          print("PASS: M13-004 frozen temporal-history boundary and accepted M13-003 predecessor are pinned")
          PY
      - name: Run M13 temporal-state tests
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
