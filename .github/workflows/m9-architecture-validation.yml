name: M9 Architecture Boundary Validation

on:
  pull_request:
    paths:
      - 'contracts/activation/**'
      - 'docs/architecture/M9-*.md'
      - 'docs/implementation/M9-*.md'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m9-architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m9-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install pyyaml

      - name: Validate repository structure
        run: python scripts_validate_repo.py

      - name: Validate M9 contract registration
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          matches = [
              item for item in manifest["contracts"]
              if item["id"] == "STH-PRODUCTION-POPULATION-ACTIVATION"
          ]
          assert len(matches) == 1, "M9 activation contract must be registered exactly once"
          item = matches[0]
          assert item["version"] == "1.0.0"
          assert item["status"] == "LOCKED"
          path = Path(item["path"])
          assert path.exists(), f"missing contract: {path}"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest == item["sha256"], f"contract hash mismatch: {digest}"
          contract = yaml.safe_load(path.read_text())
          assert contract["contract_id"] == item["id"]
          assert contract["status"] == "LOCKED"
          assert contract["milestone"] == "M9"
          assert contract["first_ticket"]["id"] == "M9-001"

          build = yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          current_ticket = build["current_ticket"]
          assert isinstance(current_ticket, str) and current_ticket.startswith("M9-"), (
              f"current ticket must remain inside the frozen M9 sequence: {current_ticket}"
          )
          ticket_doc = Path("docs/implementation") / f"{current_ticket}.md"
          assert ticket_doc.exists(), f"missing current M9 ticket document: {ticket_doc}"
          m9 = [item for item in build["milestones"] if item["id"] == "M9"]
          assert len(m9) == 1
          m9_status = m9[0]["status"]
          assert m9_status in {"IN_PROGRESS", "ACCEPTED"}, f"invalid M9 status: {m9_status}"

          if m9_status == "IN_PROGRESS":
              print(f"PASS: M9 architecture boundary is internally consistent at {current_ticket}")
          else:
              assert current_ticket == "M9-012", "M9 may be ACCEPTED only at final certification"
              final_path = Path("certification-evidence/m9-012/final-production-activation-v1.0.json")
              assert final_path.exists(), "M9 ACCEPTED requires final M9-012 certification evidence"
              final = json.loads(final_path.read_text())
              assert final["status"] == "PASS", "M9 ACCEPTED requires certification status PASS"
              assert final["verdict"] == "PASS / GO", "M9 ACCEPTED requires PASS / GO"
              assert final["open_defects"] == 0, "M9 ACCEPTED requires zero open defects"
              assert final["waivers"] == 0, "M9 ACCEPTED requires zero waivers"
              assert "Status: ACCEPTED" in ticket_doc.read_text(), "M9-012 document must be ACCEPTED"
              print("PASS: M9 final architecture boundary is ACCEPTED with certified PASS / GO evidence")
          PY
