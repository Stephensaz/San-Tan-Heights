name: M13-007B Cross-System Binding CI
on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-007B.md'
      - 'certification-evidence/m13-007a/**'
      - 'certification-evidence/m13-007b/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-007b-cross-system-binding-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m13-007b:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-007B frozen boundary and accepted A predecessor
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import yaml
          m=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          row=[x for x in m["contracts"] if x["id"]=="STH-CROSS-SYSTEM-EVIDENCE-BINDING"][0]
          p=Path(row["path"]); assert hashlib.sha256(p.read_bytes()).hexdigest()==row["sha256"]
          c=yaml.safe_load(p.read_text()); assert c["status"]=="LOCKED" and c["ticket"]=="M13-007B"; assert all(c["hard_boundaries"].values())
          pred=json.loads(Path("certification-evidence/m13-007a/unified-intelligence-governance-acceptance-v1.0.json").read_text())
          assert pred["ticket"]=="M13-007A" and pred["status"]=="ACCEPTED" and pred["waivers"]==0 and pred["open_defects"]==0
          b=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text()); assert b["current_ticket"].startswith("M13-007")
          r=yaml.safe_load(Path("registries/community_temporal_state/m13-007b-cross-system-binding-v1.0.yaml").read_text())
          assert r["status"]=="FROZEN" and r["ticket"]=="M13-007B"
          for k in ("exact_property_match","exact_community_match","temporal_boundary_must_not_be_future","fingerprints_required","deterministic_output","fail_closed_on_conflict","missing_is_explicit","stale_is_explicit","no_relevance_decision","no_state_synthesis","no_recommendation","no_prediction","no_ranking","no_seller_scoring","no_m12_execution"): assert r["policy"][k] is True
          evidence_path=Path("certification-evidence/m13-007b/cross-system-binding-acceptance-v1.0.json")
          if evidence_path.exists():
              evidence=json.loads(evidence_path.read_text())
              assert evidence["ticket"]=="M13-007B" and evidence["status"]=="ACCEPTED"
              assert evidence["parent"]["ticket"]=="M13-007A"
              assert evidence["cross_system_binding_contract_sha256"]==row["sha256"]
              assert evidence["tests"]["m13_007b_specific_passed"]==12
              assert evidence["tests"]["m13_temporal_state_total_passed"]==276
              assert evidence["tests"]["inherited_m12_passed"]==137
              assert evidence["tests"]["failed"]==0
              assert evidence["workflows"]["total"]==33
              assert evidence["workflows"]["successful"]==33
              assert evidence["workflows"]["failed"]==0
              assert evidence["waivers"]==0 and evidence["open_defects"]==0
              assert all(x["conclusion"]=="success" for x in evidence["github_workflow_runs"])
          print("PASS: M13-007B boundary, accepted M13-007A predecessor, and acceptance evidence are pinned")
          PY
      - name: Run M13-007B tests
        run: pytest -q tests/unit/community_temporal_state/test_cross_system_binding.py
      - name: Run all M13 temporal-state regression tests
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
