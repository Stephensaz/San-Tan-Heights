name: M10 Evolution CI

on:
  pull_request:
    paths:
      - 'src/evolution/**'
      - 'registries/evolution/**'
      - 'contracts/evolution/**'
      - 'certification-evidence/m10-*/**'
      - 'tests/unit/evolution/**'
      - 'docs/implementation/M10-*.md'
      - 'docs/architecture/M10-*.md'
      - 'BUILD-MANIFEST.yaml'
      - 'CONTRACT-MANIFEST.yaml'
      - 'VERSION'
      - '.github/workflows/m10-evolution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Run M10 evolution unit tests
        run: python -m pytest -q tests/unit/evolution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
