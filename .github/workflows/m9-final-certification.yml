name: M9 Final Production Activation Certification

on:
  pull_request:
    paths:
      - 'src/activation/**'
      - 'registries/activation/**'
      - 'contracts/activation/**'
      - 'certification-evidence/m9-*/**'
      - 'tests/unit/activation/**'
      - 'docs/implementation/M9-*.md'
      - 'scripts/certification/run_m9_final_certification.py'
      - '.github/workflows/m9-final-certification.yml'
      - 'BUILD-MANIFEST.yaml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Run M9 activation regression suite
        run: python -m pytest -q tests/unit/activation

      - name: Validate repository structure
        run: python scripts_validate_repo.py

      - name: Execute frozen M9-012 certification
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/certification/run_m9_final_certification.py \
            --output /tmp/m9-012-final-certification.json \
            --source-revision "$SOURCE_REVISION"

      - name: Upload M9-012 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m9-012-final-certification
          path: /tmp/m9-012-final-certification.json
          if-no-files-found: error
