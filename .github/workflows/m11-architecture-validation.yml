name: M11 Architecture Boundary Validation

on:
  pull_request:
    paths:
      - 'contracts/seller_intelligence/**'
      - 'docs/implementation/M11-*.md'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m11-architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m11-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Validate frozen M11 boundary and M10 baseline
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import yaml
          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-SELLER-INTELLIGENCE"]
          assert len(rows)==1
          row=rows[0]
          path=Path(row["path"])
          assert path.exists()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(path.read_text())
          assert contract["status"]=="LOCKED"
          assert contract["milestone"]=="M11"
          assert [x["id"] for x in contract["tickets"]]==[f"M11-{i:03d}" for i in range(1,11)]
          assert contract["m11_001"]["first_capability"]==["Current Buyer Alternative Set","Competitive Pressure"]
          boundaries=contract["hard_boundaries"]
          for key in (
              "core_platform_modification_prohibited",
              "certified_inputs_only",
              "unsupported_seller_behavior_inference_prohibited",
              "automatic_valuation_prohibited",
              "automatic_list_price_recommendation_prohibited",
              "sale_price_prediction_prohibited",
              "guaranteed_outcomes_prohibited",
              "protected_class_inference_prohibited",
              "public_strategy_by_default_prohibited",
              "autonomous_external_actions_prohibited",
              "publication_side_effects_prohibited",
          ):
              assert boundaries[key] is True
          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M10"]=="ACCEPTED"
          assert states["M11"] in {"IN_PROGRESS","ACCEPTED"}
          assert build["current_ticket"].startswith("M11-")
          assert Path("docs/implementation",build["current_ticket"]+".md").exists()
          if states["M11"]=="ACCEPTED":
              assert build["current_ticket"]=="M11-010"
              final_evidence=Path("certification-evidence/m11-010/final-adjudication-v1.0.json")
              assert final_evidence.exists()
              import json
              released=json.loads(final_evidence.read_text())
              assert released["status"]=="ACCEPTED"
              assert released["decision"]=="SELLER INTELLIGENCE RELEASED"
          m10=Path("certification-evidence/m10-010/final-adjudication-v1.0.json")
          assert m10.exists()
          print("PASS: M11 frozen Seller Intelligence boundary and released M10 baseline are present")
          PY
