name: M13-006 Scenario Intelligence CI

on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/scenario_intelligence/**'
      - 'tests/unit/scenario_intelligence/**'
      - 'docs/implementation/M13-006.md'
      - 'certification-evidence/m13-005/**'
      - 'certification-evidence/m13-006/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-006-scenario-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m13-006:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate frozen M13-006 boundary and accepted predecessor
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml

          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-SCENARIO-INTELLIGENCE"]
          assert len(rows)==1
          row=rows[0]
          path=Path(row["path"])
          assert path.exists()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(path.read_text())
          assert contract["status"]=="LOCKED"
          assert contract["ticket"]=="M13-006"
          assert len(contract["subsequence"])==10
          assert contract["subsequence"][0]=="M13-006A_SCENARIO_REGISTRY_ASSUMPTION_CONTRACT_AND_GOVERNANCE"
          assert contract["subsequence"][-1]=="M13-006J_FULL_SCENARIO_INTELLIGENCE_CERTIFICATION_REPLAY_COVERAGE_CLOSURE_AND_PRODUCTION_CANDIDATE_ADJUDICATION"
          assert contract["certification"]["additional_subticket_after_j_prohibited"] is True

          for key, value in contract["hard_boundaries"].items():
              assert value is True, key

          pred=json.loads(Path("certification-evidence/m13-005/evolution-patterns-acceptance-v1.0.json").read_text())
          assert pred["ticket"]=="M13-005"
          assert pred["status"]=="ACCEPTED"
          assert pred["waivers"]==0
          assert pred["open_defects"]==0

          registry=yaml.safe_load(Path("registries/community_temporal_state/STH-M13-006-SCENARIO-REGISTRY-v1.0.yaml").read_text())
          assert registry["status"]=="FROZEN"
          assert registry["ticket"]=="M13-006"
          for key in ("prediction_prohibited","recommendation_prohibited","ranking_prohibited","execution_prohibited"):
              assert registry["policy"][key] is True

          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          assert build["current_ticket"]=="M13-006"
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M12"]=="ACCEPTED"
          assert states["M13"]=="IN_PROGRESS"
          print("PASS: M13-006 frozen boundary and predecessor are pinned")
          PY
      - name: Run M13-006 scenario intelligence tests
        run: pytest -q tests/unit/scenario_intelligence
      - name: Run inherited M13 temporal-state regression
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
