name: M10 Architecture Boundary Validation

on:
  pull_request:
    paths:
      - 'contracts/evolution/**'
      - 'docs/architecture/M10-*.md'
      - 'docs/implementation/M10-*.md'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m10-architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m10-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts_validate_repo.py
      - name: Validate frozen M10 contract and upstream acceptance
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import yaml
          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-MULTI-COMMUNITY-PLATFORM-EVOLUTION"]
          assert len(rows)==1
          row=rows[0]; p=Path(row["path"]); assert p.exists()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==row["sha256"]
          contract=yaml.safe_load(p.read_text())
          assert contract["status"]=="LOCKED" and contract["milestone"]=="M10"
          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M9"]=="ACCEPTED"
          assert states["M10"] in {"IN_PROGRESS","ACCEPTED"}
          assert build["current_ticket"].startswith("M10-")
          assert Path("docs/implementation",build["current_ticket"]+".md").exists()
          if states["M10"]=="ACCEPTED":
              assert build["current_ticket"]=="M10-010"
              final_evidence=Path("certification-evidence/m10-010/final-adjudication-v1.0.json")
              assert final_evidence.exists()
              import json
              final=json.loads(final_evidence.read_text())
              assert final["ticket"]=="M10-010"
              assert final["status"]=="ACCEPTED"
              assert final["decision"]=="PLATFORM RELEASED"
              assert final["waivers"]==0
              assert final["open_defects"]==0
          baseline=Path("certification-evidence/m10-001/san-tan-heights-production-baseline-v1.0.0.json")
          assert baseline.exists()
          print("PASS: M10 frozen boundary and immutable M9 baseline lineage are present")
          PY
