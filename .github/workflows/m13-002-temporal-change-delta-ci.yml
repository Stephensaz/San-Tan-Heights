name: M13-002 Temporal Change Delta CI

on:
  pull_request:
    paths:
      - 'contracts/community_temporal_state/**'
      - 'registries/community_temporal_state/**'
      - 'src/community_temporal_state/**'
      - 'tests/unit/community_temporal_state/**'
      - 'docs/implementation/M13-002.md'
      - 'certification-evidence/m13-001/**'
      - 'certification-evidence/m13-002/**'
      - 'CONTRACT-MANIFEST.yaml'
      - 'BUILD-MANIFEST.yaml'
      - '.github/workflows/m13-001-community-state-snapshot-ci.yml'
      - '.github/workflows/m13-002-temporal-change-delta-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m13-002:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate M13-002 contract, predecessor, and acceptance evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml

          manifest=yaml.safe_load(Path("CONTRACT-MANIFEST.yaml").read_text())
          rows=[x for x in manifest["contracts"] if x["id"]=="STH-COMMUNITY-DELTA"]
          assert len(rows)==1
          row=rows[0]
          p=Path(row["path"])
          assert p.exists()
          contract_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert contract_sha==row["sha256"]
          contract=yaml.safe_load(p.read_text())
          assert contract["status"]=="LOCKED"
          assert contract["milestone"]=="M13"
          assert contract["ticket"]=="M13-002"

          m13_001=json.loads(Path("certification-evidence/m13-001/community-state-snapshot-acceptance-v1.0.json").read_text())
          assert m13_001["ticket"]=="M13-001"
          assert m13_001["status"]=="ACCEPTED"
          assert m13_001["waivers"]==0
          assert m13_001["open_defects"]==0

          build=yaml.safe_load(Path("BUILD-MANIFEST.yaml").read_text())
          states={x["id"]:x["status"] for x in build["milestones"]}
          assert states["M12"]=="ACCEPTED"
          assert states["M13"]=="IN_PROGRESS"
          assert build["current_ticket"].startswith("M13-")
          assert str(build["version"])=="0.1.132"

          for key in (
              "live_state_substitution_prohibited",
              "unsupported_causation_prohibited",
              "upstream_reconciliation_prohibited",
              "snapshot_mutation_prohibited",
              "delta_mutation_prohibited",
              "downstream_recalculation_prohibited",
              "selective_refresh_prohibited",
              "impact_execution_prohibited",
              "seller_recommendations_prohibited",
              "listing_actions_prohibited",
              "publication_prohibited",
              "m12_execution_mutation_prohibited",
              "inferred_effective_dates_prohibited",
              "unknown_effective_dates_must_remain_unknown",
              "protected_field_propagation_prohibited",
          ):
              assert contract["hard_boundaries"][key] is True
          assert contract["m13_003_boundary"]["no_refresh_job_creation"] is True
          assert contract["m13_003_boundary"]["no_recalculation"] is True

          evidence_path=Path("certification-evidence/m13-002/community-delta-acceptance-v1.0.json")
          assert evidence_path.exists()
          evidence=json.loads(evidence_path.read_text())
          assert evidence["ticket"]=="M13-002"
          assert evidence["status"]=="ACCEPTED"
          assert evidence["parent"]["ticket"]=="M13-001"
          assert evidence["community_delta_contract_sha256"]==contract_sha
          assert evidence["tests"]["m13_002_delta_tests"]==27
          assert evidence["tests"]["m13_temporal_state_total_passed"]==49
          assert evidence["tests"]["inherited_m12_passed"]==137
          assert evidence["tests"]["failed"]==0
          assert evidence["waivers"]==0
          assert evidence["open_defects"]==0
          assert all(x["conclusion"]=="success" for x in evidence["github_actions"].values())
          assert "Status: ACCEPTED" in Path("docs/implementation/M13-002.md").read_text()
          print("PASS: M13-002 accepted delta engine and M13-001 lineage are pinned")
          PY
      - name: Run M13 temporal-state tests
        run: pytest -q tests/unit/community_temporal_state
      - name: Run inherited M12 regression
        run: pytest -q tests/unit/listing_execution
      - name: Validate repository structure
        run: python scripts_validate_repo.py
